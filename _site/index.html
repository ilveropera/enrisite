  <!-- Script di sessione: inizializza font e colore acido per sessione/ricarica -->
  <script>
    (function() {
      // Font disponibili per il sito
      const nerdFonts = ['Fira Code', 'Inconsolata', 'JetBrains Mono', 'Share Tech Mono', 'VT323', 'Space Grotesk'];
      const acidColors = ['#ccff00', '#ff007f', '#00f6ff', '#ff5f00', '#ffff00'];

      // Rileva se la pagina è stata ricaricata/aggiornata (Browser Refresh)
      const isReload = (
        performance.getEntriesByType("navigation")[0]?.type === "reload" ||
        performance.navigation?.type === 1
      );

      if (isReload) {
        // Cancella i valori salvati in sessione e lo stato del menu
        sessionStorage.removeItem('site-session-font');
        sessionStorage.removeItem('site-session-acid-color');
        localStorage.removeItem('enri-open-categories');
      }

      let selectedFont = sessionStorage.getItem('site-session-font');
      if (!selectedFont || !nerdFonts.includes(selectedFont)) {
        selectedFont = nerdFonts[Math.floor(Math.random() * nerdFonts.length)];
        sessionStorage.setItem('site-session-font', selectedFont);
      }
      const fallbackFont = selectedFont === 'Space Grotesk' ? 'sans-serif' : 'monospace';
      document.documentElement.style.setProperty('--site-font', `"${selectedFont}", ${fallbackFont}`);
      console.info('font di sessione applicato:', selectedFont);

      let selectedColor = sessionStorage.getItem('site-session-acid-color');
      if (!selectedColor || !acidColors.includes(selectedColor)) {
        selectedColor = acidColors[Math.floor(Math.random() * acidColors.length)];
        sessionStorage.setItem('site-session-acid-color', selectedColor);
      }
      document.documentElement.style.setProperty('--acid-color', selectedColor);
      console.info('colore acido di sessione applicato:', selectedColor);
    })();
  </script>
