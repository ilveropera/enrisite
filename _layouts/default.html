<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Importazione Google Fonts: 5 Font Nerd Monospace + PT Serif per lo stile articolo NERO -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Inconsolata:wght@200..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Script di sessione: inizializza font nerd e colore acido per sessione -->
  <script>
    (function() {
      // 5 Font Nerd monospazio
      const nerdFonts = ['Fira Code', 'Inconsolata', 'JetBrains Mono', 'Share Tech Mono', 'VT323'];
      let selectedFont = sessionStorage.getItem('site-session-font');
      if (!selectedFont || !nerdFonts.includes(selectedFont)) {
        selectedFont = nerdFonts[Math.floor(Math.random() * nerdFonts.length)];
        sessionStorage.setItem('site-session-font', selectedFont);
      }
      document.documentElement.style.setProperty('--site-font', `"${selectedFont}", monospace`);
      console.info('font nerd di sessione applicato:', selectedFont);

      // Colori acidi ad alto contrasto
      const acidColors = ['#ccff00', '#ff007f', '#00f6ff', '#ff5f00', '#ffff00'];
      let selectedColor = sessionStorage.getItem('site-session-acid-color');
      if (!selectedColor || !acidColors.includes(selectedColor)) {
        selectedColor = acidColors[Math.floor(Math.random() * acidColors.length)];
        sessionStorage.setItem('site-session-acid-color', selectedColor);
      }
      document.documentElement.style.setProperty('--acid-color', selectedColor);
      console.info('colore acido di sessione applicato:', selectedColor);
    })();
  </script>
</head>
<body>

  <!-- Header: logo a sinistra, hamburger a destra -->
  <header class="site-header">
    <div class="header-logo">
      <a href="{{ '/' | relative_url }}">enri</a>
    </div>
    <button class="hamburger" id="hamburger-btn" aria-label="menu" aria-expanded="false">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
  </header>

  <!-- Contenitore di layout principale -->
  <div class="layout-container">
    
    <!-- Sfondo oscurante per chiusura menu su mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebar-close-btn" aria-label="chiudi menu">x</button>
      {% include sidebar.html %}
    </aside>

    <main class="main-content" id="main-content">
      {% if page.collection == 'articles' %}
        <!-- Articolo formattato (stile NERO Editions) -->
        <article class="article-container">
          <header class="article-header">
            <h1 class="article-title">{{ page.title }}</h1>
            <div class="article-meta">
              <time class="article-date" datetime="{{ page.date | date_to_xmlschema }}">
                {{ page.date | date: "%d %b %Y" }}
              </time>
            </div>
          </header>
          <section class="article-body">
            {{ content }}
          </section>
        </article>
      {% else %}
        <!-- Pagine standard / Home page -->
        {{ content }}
      {% endif %}
    </main>
  </div>

  <!-- PDF.js da CDN per visualizzazione documenti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
